<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Knowledge Graph Wiki</title>
  <script src="/static/3d-force-graph.min.js"></script>
  <script defer src="/static/nav.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #0b0e14; color: #e6e9ef; }
    body { display: flex; flex-direction: column; }
    #bar { padding: 8px 10px; display: flex; gap: 10px; align-items: center; background: #11151f; border-bottom: 1px solid #1e2430; flex: 0 0 auto; }
    #url { flex: 1; padding: 7px 9px; background: #0b0e14; border: 1px solid #2a3140; border-radius: 6px; color: #e6e9ef; }
    #go { padding: 7px 16px; background: #2f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #go:hover { background: #4b83f0; }
    .fast { font-size: 13px; color: #aab2c0; display: flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
    #status { padding: 5px 10px; color: #aab2c0; font-size: 13px; background: #11151f; border-bottom: 1px solid #1e2430; flex: 0 0 auto; min-height: 18px; }
    #main { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
    #logpanel { flex: 0 0 340px; display: flex; flex-direction: column; border-right: 1px solid #1e2430; background: #0d1017; }
    #logpanel h2 { margin: 0; padding: 7px 10px; font-size: 11px; font-weight: 600; color: #8892a0; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid #1e2430; }
    #log { flex: 1 1 auto; overflow-y: auto; padding: 8px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.55; color: #c9d1e0; white-space: pre-wrap; word-break: break-word; }
    #log .start { color: #79b8ff; }
    #log .done { color: #7ee787; }
    #log .fail { color: #ff7b72; }
    #graph { flex: 1 1 auto; min-width: 0; }
    #legend { position: absolute; top: 10px; right: 10px; background: rgba(13,16,23,.82); border: 1px solid #1e2430; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #c9d1e0; }
    #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #zoom { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    #zoom button { width: 34px; height: 34px; font-size: 20px; line-height: 1; color: #e6e9ef; background: rgba(17,21,31,.9); border: 1px solid #2a3140; border-radius: 8px; cursor: pointer; }
    #zoom button:hover { background: #1b2130; }
    #viewctl { position: absolute; top: 10px; left: 10px; background: rgba(13,16,23,.82); border: 1px solid #1e2430; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #c9d1e0; }
    #viewctl label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div id="bar">
    <input id="url" placeholder="Paste a URL (web page or YouTube link)" />
    <label class="fast"><input type="checkbox" id="fast" checked /> fast (captions for video)</label>
    <button id="go">Ingest</button>
  </div>
  <div id="status"></div>
  <div id="main">
    <div id="logpanel">
      <h2>Ingest log</h2>
      <div id="log"></div>
    </div>
    <div id="graph"></div>
    <div id="legend"></div>
    <div id="zoom"><button id="zoomIn" title="Zoom in">+</button><button id="zoomOut" title="Zoom out">&minus;</button></div>
    <div id="viewctl"><label><input type="checkbox" id="edgesToggle" checked /> Edges</label></div>
  </div>
  <script>
    const COLORS = {
      Technique: "#4ea1ff", Concept: "#3fb950", Model: "#f0883e", Tool: "#a371f7",
      Person: "#db6d28", Pattern: "#2ea043", Pitfall: "#f85149",
    };
    const statusEl = document.getElementById("status");
    const urlEl = document.getElementById("url");
    const graphEl = document.getElementById("graph");

    // Legend
    const legend = document.getElementById("legend");
    for (const [type, color] of Object.entries(COLORS)) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="dot" style="background:${color}"></span>${type}`;
      legend.appendChild(row);
    }

    const Graph = ForceGraph3D()(graphEl)
      .backgroundColor("#0b0e14")
      .showNavInfo(false)
      .nodeLabel(n => `<div style="background:#11151f;padding:4px 7px;border-radius:5px;border:1px solid #2a3140"><b>${n.name}</b><br><span style="opacity:.7">${n.type}</span></div>`)
      .nodeColor(n => COLORS[n.type] || "#8892a0")
      .nodeOpacity(0.95)
      .nodeRelSize(5)
      .linkColor(() => "#8193b5")
      .linkWidth(0.9)
      .linkLabel(l => l.type)
      .linkDirectionalArrowLength(3)
      .linkDirectionalArrowRelPos(1)
      .linkDirectionalParticles(2)
      .linkDirectionalParticleSpeed(0.006)
      .linkDirectionalParticleWidth(1.3)
      .onNodeClick(n => {
        statusEl.textContent = n.name + " [" + n.type + "]" + (n.description ? " - " + n.description : "");
        // ease camera toward the clicked node
        const d = 90;
        const r = 1 + d / Math.hypot(n.x || 1, n.y || 1, n.z || 1);
        Graph.cameraPosition({ x: (n.x || 0) * r, y: (n.y || 0) * r, z: (n.z || 0) * r }, n, 800);
      })
      .onLinkClick(l => {
        statusEl.textContent = "Source: " + (l.quote || "(no quote)");
      });

    function sizeGraph() { Graph.width(graphEl.clientWidth).height(graphEl.clientHeight); }
    requestAnimationFrame(sizeGraph);
    window.addEventListener("resize", sizeGraph);

    // Zoom buttons: move the camera toward / away from the center.
    function zoom(factor) {
      const p = Graph.camera().position;
      Graph.cameraPosition({ x: p.x * factor, y: p.y * factor, z: p.z * factor }, undefined, 200);
    }
    document.getElementById("zoomIn").onclick = () => zoom(0.75);
    document.getElementById("zoomOut").onclick = () => zoom(1.33);

    // Edges on/off toggle.
    const edgesToggle = document.getElementById("edgesToggle");
    edgesToggle.onchange = () => Graph.linkVisibility(edgesToggle.checked);

    async function loadGraph() {
      const g = await (await fetch("/graph")).json();
      const links = g.edges.map(e => ({ source: e.source, target: e.target, type: e.type, quote: e.quote }));
      Graph.graphData({ nodes: g.nodes, links });
    }

    const logEl = document.getElementById("log");
    function appendLog(line) {
      const div = document.createElement("div");
      if (line.includes("FAILED")) div.className = "fail";
      else if (line.includes("DONE")) div.className = "done";
      else if (line.includes("START")) div.className = "start";
      div.textContent = line;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    let logSeq = 0;
    async function pollLogs() {
      try {
        const d = await (await fetch("/logs?after=" + logSeq)).json();
        logSeq = d.seq;
        for (const line of d.lines) appendLog(line);
      } catch (e) { /* transient; keep polling */ }
    }
    setInterval(pollLogs, 1000);
    pollLogs();

    document.getElementById("go").onclick = async () => {
      const url = urlEl.value.trim();
      if (!url) return;
      const fast = document.getElementById("fast").checked;
      statusEl.textContent = "Ingesting ...";
      try {
        const r = await fetch("/ingest", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, fast }),
        });
        const data = await r.json();
        statusEl.textContent = r.ok
          ? `Added ${data.nodes} nodes, ${data.edges} edges.`
          : `Error: ${data.error}`;
        if (r.ok) { urlEl.value = ""; await loadGraph(); }
      } catch (e) {
        statusEl.textContent = "Request failed: " + e;
      }
      await pollLogs();
    };

    loadGraph();
  </script>
</body>
</html>
