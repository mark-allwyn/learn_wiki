<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Graph - Knowledge Graph</title>
  <link rel="stylesheet" href="/static/theme.css" />
  <script src="/static/3d-force-graph.min.js"></script>
  <script defer src="/static/nav.js"></script>
  <style>
    #bar { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: var(--surface-1); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
    #url { flex: 1; }
    .fast { display: flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--text-dim); font-size: var(--step--1); cursor: pointer; }
    .fast input { accent-color: var(--accent); }
    #status { padding: 7px 20px; color: var(--text-dim); font-size: var(--step--1); background: var(--surface-1); border-bottom: 1px solid var(--border); flex: 0 0 auto; min-height: 20px; }
    #main { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }

    #logpanel { flex: 0 0 320px; display: flex; flex-direction: column; background: var(--surface-1); border-right: 1px solid var(--border); }
    #logpanel h2 { padding: 11px 16px; font-size: .68rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); border-bottom: 1px solid var(--border); }
    #log { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px; font-family: var(--font-sans); font-size: .8rem; line-height: 1.7; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; }
    #log .start { color: var(--t-technique); }
    #log .done { color: var(--t-concept); }
    #log .fail { color: var(--t-pitfall); }

    #graph { flex: 1 1 auto; min-width: 0; }

    .panel { position: absolute; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-1); }
    #legend { top: 16px; right: 16px; padding: 12px 14px; }
    #legend .lt { font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: .8rem; color: var(--text-dim); }
    #legend .dot { width: 9px; height: 9px; border-radius: 50%; }
    #zoom { left: 16px; bottom: 16px; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    #zoom button { width: 38px; height: 38px; font-size: 20px; color: var(--text-dim); background: transparent; border: 0; border-radius: 0; }
    #zoom button:first-child { border-bottom: 1px solid var(--border); }
    #zoom button:hover { background: var(--surface-3); color: var(--text); }
    #viewctl { top: 16px; left: 16px; padding: 9px 13px; }
    #viewctl label { display: flex; align-items: center; gap: 8px; font-size: var(--step--1); color: var(--text-dim); cursor: pointer; }
    #viewctl input { accent-color: var(--accent); }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div id="nav"></div>
  <div id="bar" class="reveal">
    <input id="url" type="text" placeholder="Paste a URL - a web page or a YouTube link" />
    <label class="fast"><input type="checkbox" id="fast" checked /> fast (captions for video)</label>
    <button id="go">Ingest</button>
  </div>
  <div id="status"></div>
  <div id="main">
    <div id="logpanel">
      <h2>Ingest log</h2>
      <div id="log"></div>
    </div>
    <div id="graph"></div>
    <div id="legend" class="panel"></div>
    <div id="zoom" class="panel"><button id="zoomIn" title="Zoom in">+</button><button id="zoomOut" title="Zoom out">&minus;</button></div>
    <div id="viewctl" class="panel"><label><input type="checkbox" id="edgesToggle" checked /> Edges</label></div>
  </div>
  <script>
    const COLORS = {
      Technique: "#5b9dff", Concept: "#4cc38a", Model: "#d98f3a", Tool: "#b98cff",
      Person: "#ff8f6b", Pattern: "#33c2c2", Pitfall: "#ff6b81",
    };
    const statusEl = document.getElementById("status");
    const urlEl = document.getElementById("url");
    const graphEl = document.getElementById("graph");

    const legend = document.getElementById("legend");
    legend.innerHTML = '<div class="lt">Entity type</div>';
    for (const [type, color] of Object.entries(COLORS)) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="dot" style="background:${color};color:${color}"></span>${type}`;
      legend.appendChild(row);
    }

    const Graph = ForceGraph3D()(graphEl)
      .backgroundColor("#0e0f13")
      .showNavInfo(false)
      .nodeLabel(n => `<div style="font-family:'Plus Jakarta Sans',sans-serif;background:#191c23;color:#e9ebf0;padding:6px 10px;border-radius:8px;border:1px solid #333844;box-shadow:0 8px 24px rgba(0,0,0,.5)"><b>${n.name}</b><br><span style="opacity:.6;font-size:.85em">${n.type}</span></div>`)
      .nodeColor(n => COLORS[n.type] || "#8892a0")
      .nodeOpacity(1)
      .nodeRelSize(4.5)
      .linkColor(() => "#9aa1b0")
      .linkOpacity(0.85)
      .linkWidth(1.2)
      .linkLabel(l => l.type)
      .linkDirectionalArrowLength(3.2)
      .linkDirectionalArrowRelPos(1)
      .onNodeClick(n => {
        statusEl.textContent = n.name + " [" + n.type + "]" + (n.description ? " - " + n.description : "");
        const r = 1 + 90 / Math.hypot(n.x || 1, n.y || 1, n.z || 1);
        Graph.cameraPosition({ x: (n.x || 0) * r, y: (n.y || 0) * r, z: (n.z || 0) * r }, n, 800);
      })
      .onLinkClick(l => {
        statusEl.textContent = "Source: " + (l.quote || "(no quote)");
      });

    function sizeGraph() { Graph.width(graphEl.clientWidth).height(graphEl.clientHeight); }
    requestAnimationFrame(sizeGraph);
    window.addEventListener("resize", sizeGraph);

    // Zoom buttons: move the camera toward / away from the center.
    function zoom(factor) {
      const p = Graph.camera().position;
      Graph.cameraPosition({ x: p.x * factor, y: p.y * factor, z: p.z * factor }, undefined, 200);
    }
    document.getElementById("zoomIn").onclick = () => zoom(0.75);
    document.getElementById("zoomOut").onclick = () => zoom(1.33);

    // Edges on/off toggle.
    const edgesToggle = document.getElementById("edgesToggle");
    edgesToggle.onchange = () => Graph.linkVisibility(edgesToggle.checked);

    async function loadGraph() {
      const g = await (await fetch("/graph")).json();
      const links = g.edges.map(e => ({ source: e.source, target: e.target, type: e.type, quote: e.quote }));
      Graph.graphData({ nodes: g.nodes, links });
    }

    const logEl = document.getElementById("log");
    function appendLog(line) {
      const div = document.createElement("div");
      if (line.includes("FAILED")) div.className = "fail";
      else if (line.includes("DONE")) div.className = "done";
      else if (line.includes("START")) div.className = "start";
      div.textContent = line;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    let logSeq = 0;
    async function pollLogs() {
      try {
        const d = await (await fetch("/logs?after=" + logSeq)).json();
        logSeq = d.seq;
        for (const line of d.lines) appendLog(line);
      } catch (e) { /* transient; keep polling */ }
    }
    setInterval(pollLogs, 1000);
    pollLogs();

    document.getElementById("go").onclick = async () => {
      const url = urlEl.value.trim();
      if (!url) return;
      const fast = document.getElementById("fast").checked;
      statusEl.textContent = "Ingesting ...";
      try {
        const r = await fetch("/ingest", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, fast }),
        });
        const data = await r.json();
        statusEl.textContent = r.ok
          ? `Added ${data.nodes} nodes, ${data.edges} edges.`
          : `Error: ${data.error}`;
        if (r.ok) { urlEl.value = ""; await loadGraph(); }
      } catch (e) {
        statusEl.textContent = "Request failed: " + e;
      }
      await pollLogs();
    };

    loadGraph();
  </script>
</body>
</html>
