<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wiki - Knowledge Graph</title>
  <link rel="stylesheet" href="/static/theme.css" />
  <script defer src="/static/nav.js"></script>
  <style>
    #content { max-width: 860px; margin: 0 auto; padding: 40px 28px 90px; }

    /* Index */
    .lede { color: var(--text-dim); font-size: var(--step-1); margin: 6px 0 26px; max-width: 60ch; }
    .index-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .index-head h1 { font-family: var(--font-display); font-size: var(--step-3); }
    .count { color: var(--text-faint); font-size: var(--step--1); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    #filter { width: 100%; margin: 4px 0 30px; }
    .type-group { margin: 0 0 30px; }
    .type-group > h2 {
      font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-faint);
      display: flex; align-items: center; gap: 10px; margin: 0 0 12px;
    }
    .type-group > h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gc, var(--text-faint)); box-shadow: 0 0 10px var(--gc, transparent); }
    .type-group > h2 .n { color: var(--text-faint); letter-spacing: .05em; margin-left: auto; opacity: .7; }
    .ent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 22px; }
    .ent {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 7px 10px; margin: 0 -10px; border-radius: var(--radius-sm);
      color: var(--text); text-decoration: none;
      border: 1px solid transparent; transition: background .14s ease, border-color .14s ease;
    }
    .ent:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }
    .ent .nm { font-size: var(--step-0); }
    .ent .deg { color: var(--text-faint); font-size: .76rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Entity page */
    .back { display: inline-block; color: var(--text-faint); font-size: var(--step--1); letter-spacing: .04em; margin-bottom: 22px; }
    .back:hover { color: var(--text-dim); }
    .entity-title { font-family: var(--font-display); font-size: var(--step-3); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .entity-desc { color: var(--text-dim); font-size: var(--step-1); line-height: 1.65; margin: 14px 0 34px; max-width: 64ch; }
    .rel-group { margin: 0 0 26px; }
    .rel-group > h3 {
      font-family: var(--font-sans); font-size: .74rem; letter-spacing: .16em; text-transform: uppercase;
      color: var(--text-faint); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 0 0 14px;
    }
    .rel { padding: 0 0 4px 20px; margin: 0 0 18px; position: relative; }
    .rel .arrow { position: absolute; left: 0; top: 2px; color: var(--text-faint); font-size: .9rem; }
    .rel .to { font-size: var(--step-1); }
    .rel .to a { color: var(--text); }
    .rel .to a:hover { color: var(--accent); }
    .rel blockquote {
      margin: 9px 0 6px; padding: 6px 0 6px 15px; border-left: 2px solid var(--border-2);
      color: var(--text-dim); font-family: var(--font-display); font-style: italic; font-size: 1.02rem; line-height: 1.55;
    }
    .rel .src { font-size: .78rem; color: var(--text-faint); }
    .rel .src a { color: var(--text-faint); text-decoration: underline; text-underline-offset: 2px; }
    .rel .src a:hover { color: var(--accent); }
    .sources { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-size: .8rem; color: var(--text-dim); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; text-decoration: none;
    }
    .chip:hover { border-color: var(--border-2); color: var(--text); }
    .muted { color: var(--text-faint); }
    .empty { color: var(--text-dim); font-size: var(--step-1); margin-top: 30px; }
    .empty a { font-weight: 600; }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div id="nav"></div>
  <div id="content">Loading ...</div>
  <script>
    const TYPE_COLORS = {
      Technique: "#5b9dff", Concept: "#4cc38a", Model: "#d98f3a", Tool: "#b98cff",
      Person: "#ff8f6b", Pattern: "#33c2c2", Pitfall: "#ff6b81",
    };
    const content = document.getElementById("content");
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function badge(type) {
      return `<span class="badge type-${esc(type)}">${esc(type)}</span>`;
    }
    function safeHref(url) {
      const u = String(url || "");
      return /^https?:\/\//i.test(u) ? esc(u) : "#";
    }

    async function renderIndex() {
      const ents = await (await fetch("/api/entities")).json();
      if (!ents.length) {
        content.innerHTML = "<p class='empty'>No entities yet. Ingest some sources on the <a href='/'>Graph</a> page and they will appear here.</p>";
        return;
      }
      const groups = {};
      for (const e of ents) (groups[e.type] = groups[e.type] || []).push(e);
      let html = `<div class="reveal"><div class="index-head"><h1>The Wiki</h1>`
               + `<span class="count">${ents.length} entities</span></div>`
               + `<p class="lede">Every idea extracted from your sources, and how they connect.</p>`
               + `<input id="filter" type="text" placeholder="Filter entities ..." /></div>`;
      let d = 1;
      for (const type of Object.keys(groups).sort()) {
        const c = TYPE_COLORS[type] || "#6b7488";
        html += `<div class="type-group reveal d${Math.min(d, 3)}" style="--gc:${c}">`
              + `<h2>${esc(type)}<span class="n">${groups[type].length}</span></h2><div class="ent-grid">`;
        for (const e of groups[type]) {
          html += `<a class="ent" href="/wiki?id=${e.id}" data-name="${esc(e.name).toLowerCase()}">`
                + `<span class="nm">${esc(e.name)}</span>`
                + `<span class="deg">${e.degree} link${e.degree === 1 ? "" : "s"}</span></a>`;
        }
        html += "</div></div>";
        d++;
      }
      content.innerHTML = html;
      const filter = document.getElementById("filter");
      filter.oninput = () => {
        const q = filter.value.trim().toLowerCase();
        for (const a of content.querySelectorAll(".ent"))
          a.style.display = a.dataset.name.includes(q) ? "" : "none";
        for (const g of content.querySelectorAll(".type-group")) {
          const any = [...g.querySelectorAll(".ent")].some(a => a.style.display !== "none");
          g.style.display = any ? "" : "none";
        }
      };
    }

    async function renderEntity(nodeId) {
      const r = await fetch("/api/entity/" + encodeURIComponent(nodeId));
      if (!r.ok) {
        content.innerHTML = "<p class='empty'>Entity not found. <a href='/wiki'>Back to the index</a></p>";
        return;
      }
      const d = await r.json();
      let html = `<div class="reveal"><a class="back" href="/wiki">&larr; All entities</a>`
               + `<h1 class="entity-title">${esc(d.node.name)} ${badge(d.node.type)}</h1>`;
      if (d.node.description) html += `<p class="entity-desc">${esc(d.node.description)}</p>`;
      html += "</div>";

      const byType = {};
      for (const rel of d.relationships) (byType[rel.type] = byType[rel.type] || []).push(rel);
      if (!d.relationships.length) html += "<p class='muted'>No relationships recorded yet.</p>";

      let step = 1;
      for (const type of Object.keys(byType).sort()) {
        html += `<div class="rel-group reveal d${Math.min(step, 3)}"><h3>${esc(type)}</h3>`;
        for (const rel of byType[type]) {
          const arrow = rel.direction === "out" ? "&rarr;" : "&larr;";
          html += `<div class="rel"><span class="arrow">${arrow}</span>`
                + `<div class="to"><a href="/wiki?id=${rel.other.id}">${esc(rel.other.name)}</a> ${badge(rel.other.type)}</div>`
                + `<blockquote>${esc(rel.quote)}</blockquote>`
                + `<div class="src">via <a href="${safeHref(rel.source_url)}" target="_blank" rel="noopener">${esc(rel.source_title || rel.source_url)}</a></div>`
                + `</div>`;
        }
        html += "</div>";
        step++;
      }

      if (d.sources.length) {
        html += `<div class="rel-group reveal d3"><h3>Sources</h3><div class="sources">`;
        for (const s of d.sources)
          html += `<a class="chip" href="${safeHref(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a>`;
        html += "</div></div>";
      }
      content.innerHTML = html;
    }

    (id ? renderEntity(id) : renderIndex()).catch(e => {
      content.innerHTML = "<p class='empty'>Failed to load: " + esc(e) + "</p>";
    });
  </script>
</body>
</html>
